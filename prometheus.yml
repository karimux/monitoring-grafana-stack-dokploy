global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "production"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "srv-3-monitoring-backup"
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "srv-1-app-prod"
    static_configs:
      - targets: ["212.47.75.9:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["212.47.75.9:9340"]

  # Ajoute ici tes propres apps déployées via Dokploy, tant qu'elles sont
  # sur le même réseau "monitoring" (ou "dokploy-network" si tu les rattaches).
  # - job_name: "mon-app"
  #   static_configs:
  #     - targets: ["mon-app:PORT"]
  #       labels:
  #         service: "mon-app"
