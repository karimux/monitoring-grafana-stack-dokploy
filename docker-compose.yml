# NOTE Dokploy :
# - Ne PAS mapper de "ports:" ici -> Dokploy route le trafic via son réseau interne
#   "dokploy-network" + Traefik, configuré depuis l'onglet "Domains" de l'UI.
# - Les variables ${...} sont à définir dans l'onglet "Environment" de Dokploy
#   (elles finissent dans un .env à côté de ce fichier).
# - x-logging est un ancrage YAML réutilisé par tous les services pour uniformiser
#   la rotation des logs Docker (voir section "Rotation des logs" du README).

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"      # taille max par fichier de log
    max-file: "5"        # nb de fichiers conservés -> ~100 Mo max / conteneur
    compress: "true"      # compresse les logs archivés

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  rules:
  alertmanager_data:

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534" # nobody -> lecture seule, bonne pratique sécu
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:rw
      - rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Rétention des métriques (pas des "logs") : 15 jours + garde-fou en taille
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.enable-lifecycle"          # permet un reload à chaud (POST /-/reload)
      - "--web.route-prefix=/"
    networks:
      - monitoring
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitoring
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - monitoring
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GF_ROOT_URL}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Grafana écrit ses propres logs en stdout -> capturés par le driver Docker ci-dessus
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
    logging: *default-logging
    depends_on:
      - prometheus
